<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Il mio sito</title>
  <meta name="description" content="Benvenuto nel mio sito personale.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #111827;
    }

    .hero p {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #111827;
      color: #aaa;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      nav a {
        margin-left: 10px;
      }

      .hero h2 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Il mio sito</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#contatti">Contatti</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <div class="hero-content">
        <h2>Benvenuto!</h2>

        <p>
          Questa è la mia nuova pagina web pubblicata con GitHub Pages.
        </p>

        <a class="button" href="#contatti">
          Scopri di più
        </a>
      </div>
    </section>
  </main>

  <footer id="contatti">
    <p>© 2026 Il mio sito · Pubblicato con GitHub Pages</p>
  </footer>

</body>
</html>
